spring.application.name=miqa-store-backend
server.port=8081
server.address=127.0.0.1
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:miqa_store_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.mvc.problemdetails.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
miqa.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Product uploads; public delivery is handled by the configured media server.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
app.media.storage-path=${MEDIA_STORAGE_PATH:.local/media}
app.media.base-url=${MEDIA_BASE_URL:}

app.admin.jwt-secret=${ADMIN_JWT_SECRET}
app.admin.jwt-expiration=${ADMIN_JWT_EXPIRATION:PT1H}

# Only aggregate health is available, without infrastructure details or JMX.
management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoints.web.exposure.include=health
management.endpoints.web.discovery.enabled=false
management.endpoints.jmx.exposure.exclude=*
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
management.endpoint.health.probes.enabled=false

# Stage 1 only. Independent HMAC secret; receiving and local processing are opt-in.
app.erp.webhook.receive-enabled=${MIQA_ERP_WEBHOOK_RECEIVE_ENABLED:false}
app.erp.webhook.processing-enabled=${MIQA_ERP_WEBHOOK_PROCESSING_ENABLED:false}
app.erp.webhook.secret=${MIQA_ERP_WEBHOOK_SECRET:}
app.erp.webhook.timestamp-tolerance-seconds=${MIQA_ERP_WEBHOOK_TIMESTAMP_TOLERANCE_SECONDS:300}
app.erp.webhook.queue-interval-ms=${MIQA_ERP_WEBHOOK_QUEUE_INTERVAL_MS:5000}
app.erp.webhook.coalesce-seconds=${MIQA_ERP_WEBHOOK_COALESCE_SECONDS:3}
app.erp.webhook.batch-size=${MIQA_ERP_WEBHOOK_BATCH_SIZE:200}
app.erp.webhook.initial-backoff-seconds=${MIQA_ERP_WEBHOOK_INITIAL_BACKOFF_SECONDS:30}
app.erp.webhook.max-backoff-seconds=${MIQA_ERP_WEBHOOK_MAX_BACKOFF_SECONDS:900}
app.erp.webhook.backoff-steps=${MIQA_ERP_WEBHOOK_BACKOFF_STEPS:6}

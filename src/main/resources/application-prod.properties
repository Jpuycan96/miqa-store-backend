# Environment-specific values are required; no development credential fallback.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.clean-disabled=true
server.address=127.0.0.1
server.port=8082
server.forward-headers-strategy=framework
miqa.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
app.admin.jwt-secret=${ADMIN_JWT_SECRET}
app.admin.jwt-expiration=${ADMIN_JWT_EXPIRATION}
app.media.storage-path=${MEDIA_STORAGE_PATH}
app.media.base-url=${MEDIA_BASE_URL}
# stdout/stderr -> journald. Never enable request bodies or SQL bind logging.
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
spring.mvc.log-request-details=false
spring.jpa.show-sql=false
